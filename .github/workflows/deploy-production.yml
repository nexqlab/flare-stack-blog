name: 发布生产博客

on:
  workflow_dispatch:
    inputs:
      confirm_legacy_upgrade:
        description: "接受 0011–0021 升级：删除旧访问统计及友链联系邮箱、将待审核评论公开；已确认备份"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qiqid-blog-production
  cancel-in-progress: false

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  WORKER_NAME: ${{ vars.WORKER_NAME }}
  DOMAIN: ${{ vars.DOMAIN }}
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  QUEUE_NAME: ${{ vars.QUEUE_NAME }}
  KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
  VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
  VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID || secrets.VITE_UMAMI_WEBSITE_ID }}

jobs:
  validate:
    name: 检查发布入口与配置
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 仅接受 main 的手动发布
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::生产发布只能从 main 手动运行。"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 校验凭据存在及固定生产资源
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/deploy-production-preflight.ts --check-config

  quality:
    name: 代码检查与测试
    needs: validate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: 构建、迁移与发布
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装锁定依赖
        run: bun ci

      - name: 生成生产配置
        run: bun run wrangler:prepare

      - name: 构建
        run: bun run build

      - name: 检查部署产物（不上传）
        run: bunx --no-install wrangler deploy --dry-run

      - name: 只读检查生产、迁移记录与恢复书签
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_LEGACY_UPGRADE: ${{ inputs.confirm_legacy_upgrade }}
        run: bun scripts/deploy-production-preflight.ts --preflight

      - name: 执行 D1 迁移
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migrate

      - name: 发布现有 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx --no-install wrangler deploy --keep-vars

      - name: 检查首页与登录入口
        shell: bash
        run: |
          for path in / /login /admin; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 --output /dev/null "https://qiqid.com$path"
          done
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### 发布完成
          - 已检查首页与登录入口 HTTP 响应。
          - 请人工确认历史文章、GitHub 登录及后台操作。
          - 首次升级后，在后台「设置 → 维护」重建搜索索引，再验证历史文章搜索。
          SUMMARY
